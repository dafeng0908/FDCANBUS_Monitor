# CANBUS_Monitor Harness configuration
# 位置：CANBUS_Monitor/config/harness.toml
# 相對路徑均以 repository 根目錄為基準。

[firmware]
project_dir = "firmware/FDCAN_TOOL_cmake"
project_name = "FDCAN_TOOL"
configure_preset = "debug_GCC_NUCLEO-C542RC"
build_preset = "debug_GCC_NUCLEO-C542RC"
artifact = "build/debug_GCC_NUCLEO-C542RC/FDCAN_TOOL.elf"
timeout_seconds = 600

[tools]
# 請依實際安裝版本修改。
# Windows TOML 建議使用正斜線。
stm32cubeide = "C:/ST/STM32CubeIDE_2.2.0/STM32CubeIDE/stm32cubeide.exe"
arm_gnu_toolchain_bin = "C:/ST/STM32CubeIDE_2.2.0/STM32CubeIDE/plugins/com.st.stm32cube.ide.mcu.externaltools.gnu-tools-for-stm32.14.3.rel1.win32_1.0.100.202602081740/tools/bin"
# 若已加入 PATH，也可改成：
# stm32cubeide = "stm32cubeide"

[reports]
stdout_log = "reports/latest/build.stdout.log"
stderr_log = "reports/latest/build.stderr.log"
