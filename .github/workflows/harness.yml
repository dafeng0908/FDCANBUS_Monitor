name: Harness checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stage-0:
    runs-on: ubuntu-latest
    env:
      ARM_GNU_TOOLCHAIN_RELEASE: 14.3.Rel1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ARM GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ env.ARM_GNU_TOOLCHAIN_RELEASE }}
      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck ruby-full
          python -m pip install "gcovr>=8,<9"
          sudo gem install ceedling --no-document
      - name: Run quality gate
        run: python tools.py quality
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence
          path: |
            reports/latest/
            firmware/FDCAN_TOOL_cmake/build/**/*.elf
            firmware/FDCAN_TOOL_cmake/build/**/*.map
          if-no-files-found: warn
